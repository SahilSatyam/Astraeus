# Umbrella chart values — local development defaults.
# All services enabled, minimal resources, no rollouts.

api:
  enabled: true

oms:
  enabled: true

workers:
  enabled: true

web:
  enabled: true

# Override sub-chart values for local dev
astraeus-api:
  replicaCount: 1
  rollout:
    enabled: false
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  networkPolicy:
    enabled: false
  ingress:
    enabled: true
    hosts:
      - host: api.localhost
        paths:
          - path: /
            pathType: Prefix

astraeus-oms:
  replicaCount: 1
  rollout:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  networkPolicy:
    enabled: false

astraeus-workers:
  replicaCount: 1
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  networkPolicy:
    enabled: false

astraeus-web:
  replicaCount: 1
  rollout:
    enabled: false
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  networkPolicy:
    enabled: false
  ingress:
    enabled: true
    hosts:
      - host: app.localhost
        paths:
          - path: /
            pathType: Prefix
