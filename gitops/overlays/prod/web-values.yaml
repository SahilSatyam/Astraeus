# Production overrides for astraeus-web
replicaCount: 2

image:
  pullPolicy: Always

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

rollout:
  enabled: true
  strategy: canary
  canary:
    steps:
      - setWeight: 10
      - pause:
          duration: 5m
      - setWeight: 50
      - pause:
          duration: 10m
