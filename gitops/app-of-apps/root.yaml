# Root Application — bootstraps all domain applications.
# This is the single entry point for ArgoCD to reconcile the entire platform.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: astraeus-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/sahil/Astraeus.git
    targetRevision: main
    path: gitops/app-of-apps
    directory:
      recurse: false
      include: "*.yaml"
      exclude: root.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
