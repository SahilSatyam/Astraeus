# Trading domain — OMS and reconciliation
# Manual sync required during market hours (sync window on project).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-oms
  namespace: argocd
spec:
  project: trading
  source:
    repoURL: https://github.com/sahil/Astraeus.git
    targetRevision: main
    path: apps/oms/deploy/chart
    helm:
      valueFiles:
        - ../../../../gitops/overlays/prod/oms-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  syncPolicy:
    # NOT automated — trading requires manual sync approval
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
