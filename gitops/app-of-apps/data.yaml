# Data domain — CNPG Postgres cluster
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-postgres
  namespace: argocd
spec:
  project: data
  source:
    repoURL: https://github.com/sahil/Astraeus.git
    targetRevision: main
    path: infra/k8s/data
    directory:
      recurse: false
      include: "*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    # Data services require manual sync — no surprise reconciliations
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
