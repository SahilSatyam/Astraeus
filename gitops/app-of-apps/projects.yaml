# ArgoCD Projects — RBAC boundaries per domain.
# Each project restricts which namespaces and repos an Application can target.
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform infrastructure (ingress, vault, cert-manager, otel)
  sourceRepos:
    - https://github.com/sahil/Astraeus.git
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://helm.releases.hashicorp.com
  destinations:
    - namespace: ingress
      server: https://kubernetes.default.svc
    - namespace: platform
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: networking.k8s.io
      kind: IngressClass
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  description: Monitoring, logging, tracing
  sourceRepos:
    - https://github.com/sahil/Astraeus.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
  destinations:
    - namespace: observability
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: monitoring.coreos.com
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: data
  namespace: argocd
spec:
  description: Data services (Postgres, Redis, Redpanda)
  sourceRepos:
    - https://github.com/sahil/Astraeus.git
  destinations:
    - namespace: data
      server: https://kubernetes.default.svc
    - namespace: streaming
      server: https://kubernetes.default.svc
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: research
  namespace: argocd
spec:
  description: Research API and workers
  sourceRepos:
    - https://github.com/sahil/Astraeus.git
  destinations:
    - namespace: research
      server: https://kubernetes.default.svc
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: trading
  namespace: argocd
spec:
  description: Trading services (OMS, reconciliation, kill-switch)
  sourceRepos:
    - https://github.com/sahil/Astraeus.git
  destinations:
    - namespace: trading
      server: https://kubernetes.default.svc
  # Sync windows — no deploys during market hours
  syncWindows:
    - kind: deny
      schedule: "25 9 * * 1-5"   # 09:25 ET
      duration: 10m
      applications: ["*"]
      timeZone: America/New_York
    - kind: deny
      schedule: "55 15 * * 1-5"  # 15:55 ET
      duration: 10m
      applications: ["*"]
      timeZone: America/New_York
    - kind: deny
      schedule: "30 9 * * 1-5"   # Market open → close
      duration: 6h30m
      applications: ["*"]
      timeZone: America/New_York
      manualSync: true            # Allow manual sync during market hours
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: web
  namespace: argocd
spec:
  description: Web dashboard (Next.js)
  sourceRepos:
    - https://github.com/sahil/Astraeus.git
  destinations:
    - namespace: web
      server: https://kubernetes.default.svc
