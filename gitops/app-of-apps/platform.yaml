# Platform domain — infrastructure services (OTel, Linkerd, Kyverno, Velero)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-otel-collector
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/sahil/Astraeus.git
    targetRevision: main
    path: infra/k8s/platform
    directory:
      recurse: false
      include: "otel-collector.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
