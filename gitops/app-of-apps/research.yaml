# Research domain — API and workers
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: research-api
  namespace: argocd
spec:
  project: research
  source:
    repoURL: https://github.com/sahil/Astraeus.git
    targetRevision: main
    path: apps/api/deploy/chart
    helm:
      valueFiles:
        - ../../../../gitops/overlays/prod/api-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: research
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: research-workers
  namespace: argocd
spec:
  project: research
  source:
    repoURL: https://github.com/sahil/Astraeus.git
    targetRevision: main
    path: apps/workers/deploy/chart
    helm:
      valueFiles:
        - ../../../../gitops/overlays/prod/workers-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: research
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
