name: ADR check

# All third-party actions are pinned by commit SHA. See SECURITY.md.

on:
  pull_request:
    paths:
      - "docs/adr/**"

jobs:
  validate:
    name: Validate ADR titles + status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Each ADR has a status line
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(docs/adr/[0-9]*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No ADR files found — nothing to validate."
            exit 0
          fi
          fail=0
          for f in "${files[@]}"; do
              if ! grep -E '^\*\*Status\*\*:\s+(proposed|accepted|superseded by [0-9]+|rejected)' "$f" >/dev/null; then
                  echo "::error file=$f::ADR is missing a valid '**Status**:' line"
                  fail=1
              fi
          done
          exit "$fail"
