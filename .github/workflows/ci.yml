name: CI

# All third-party actions are pinned by commit SHA per supply-chain hardening
# (see SECURITY.md). Dependabot is configured to bump these automatically;
# review the diff before merging the bump PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.6.0"
  # Coverage floor for the unit suite. Set deliberately low for the first
  # green build; raise it ratchet-style as coverage improves. CI will fail
  # if coverage drops below this number, which is the whole point.
  COVERAGE_MIN: "30"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: uv run mypy apps libs

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: >
          uv run pytest -m unit
          --cov=libs --cov=apps
          --cov-report=term-missing
          --cov-fail-under=${{ env.COVERAGE_MIN }}

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: astraeus
          POSTGRES_PASSWORD: astraeus
          POSTGRES_DB: astraeus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astraeus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ASTRAEUS_DB_HOST: localhost
      ASTRAEUS_DB_PORT: "5432"
      ASTRAEUS_DB_USER: astraeus
      ASTRAEUS_DB_PASSWORD: astraeus
      ASTRAEUS_DB_NAME: astraeus
      ASTRAEUS_REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: cd libs/db && uv run alembic upgrade head
      - run: cd libs/db && uv run alembic downgrade -1
      - run: cd libs/db && uv run alembic upgrade head
      - run: uv run pytest -m integration || [ $? -eq 5 ]

  import-audit:
    name: Import isolation (LLM ↔ Broker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv run python scripts/import_audit.py

  env-lint:
    name: .env parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: uv run python scripts/env-lint.py
