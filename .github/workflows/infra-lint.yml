# CI pipeline for Phase 10 infrastructure code.
# Validates Terraform, Helm charts, and policy checks on every PR.
#
# All third-party actions are pinned by commit SHA. See SECURITY.md.
# trivy-action does not publish stable tags; we pin the specific master SHA
# at the time of the bump and rely on Dependabot to refresh it.
name: Infrastructure Lint

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "apps/*/deploy/chart/**"
      - "gitops/**"
      - "infra/k8s/**"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "apps/*/deploy/chart/**"
      - "gitops/**"
      - "infra/k8s/**"

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Skip if env dir missing
        id: check
        run: |
          if [ ! -d "infra/terraform/envs/${{ matrix.env }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@651471c36a6092792c552e8b1bef71e592b462d8 # v3.1.1
        if: steps.check.outputs.skip != 'true'
        with:
          terraform_version: "1.7.x"

      - name: Terraform Init (no backend)
        if: steps.check.outputs.skip != 'true'
        run: terraform init -backend=false
        working-directory: infra/terraform/envs/${{ matrix.env }}

      - name: Terraform Validate
        if: steps.check.outputs.skip != 'true'
        run: terraform validate
        working-directory: infra/terraform/envs/${{ matrix.env }}

      - name: TFLint
        if: steps.check.outputs.skip != 'true'
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: latest

      - name: Run TFLint
        if: steps.check.outputs.skip != 'true'
        run: |
          tflint --init
          tflint --recursive
        working-directory: infra/terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}

  helm-lint:
    name: Helm Lint & Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: "v3.14.0"

      - name: Lint all charts
        run: |
          shopt -s nullglob
          charts=(apps/*/deploy/chart)
          if [ ${#charts[@]} -eq 0 ]; then
            echo "No Helm charts found — skipping."
            exit 0
          fi
          for chart in "${charts[@]}"; do
            echo "==> Linting $chart"
            helm lint "$chart" --strict
          done

      - name: Template all charts (dry-run)
        run: |
          shopt -s nullglob
          charts=(apps/*/deploy/chart)
          [ ${#charts[@]} -eq 0 ] && exit 0
          for chart in "${charts[@]}"; do
            echo "==> Templating $chart"
            helm template test "$chart" > /dev/null
          done

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate K8s schemas
        run: |
          shopt -s nullglob
          charts=(apps/*/deploy/chart)
          [ ${#charts[@]} -eq 0 ] && exit 0
          for chart in "${charts[@]}"; do
            echo "==> Validating $chart against K8s schemas"
            helm template test "$chart" | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              || true  # CRDs may not have schemas; warn but don't fail
          done

  policy-checks:
    name: Policy Checks (no latest tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for 'latest' tag in charts
        run: |
          shopt -s nullglob
          files=(apps/*/deploy/chart/values.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No chart values found — skipping."
            exit 0
          fi
          if grep -r 'tag:.*latest' "${files[@]}"; then
            echo "ERROR: 'latest' tag found in Helm values. Use explicit tags or digests."
            exit 1
          fi
          echo "OK: No 'latest' tags found."

      - name: Check for secrets in manifests
        run: |
          shopt -s nullglob
          dirs=()
          [ -d "apps" ] && dirs+=(apps/*/deploy/chart/)
          [ -d "gitops" ] && dirs+=(gitops/)
          [ -d "infra/k8s" ] && dirs+=(infra/k8s/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No manifest directories found — skipping."
            exit 0
          fi
          if grep -rE '(password|secret|api_key|token)\s*[:=]\s*["\x27][^{]' \
            "${dirs[@]}" \
            --include="*.yaml" --include="*.yml" | grep -v '#'; then
            echo "ERROR: Potential hardcoded secrets found in manifests."
            exit 1
          fi
          echo "OK: No hardcoded secrets detected."

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore
