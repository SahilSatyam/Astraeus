[project]
name = "astraeus-oms"
version = "0.1.0"
description = "Order Management System — state machine, event sourcing, idempotent submission."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "astraeus-domain",
    "astraeus-config",
    "astraeus-db",
    "astraeus-trading",
    "astraeus-brokers",
    "astraeus-risk",
    "astraeus-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_oms"]
