# Default values for astraeus-oms.
# Blue/green deployment — no canary for order management.
replicaCount: 2

image:
  repository: ghcr.io/astraeus/oms
  pullPolicy: IfNotPresent
  tag: ""

serviceAccount:
  create: true
  name: oms
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/astraeus-prod-oms

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: false  # OMS scales manually; predictable load

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 2

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

nodeSelector:
  astraeus.io/pool: trading

tolerations:
  - key: astraeus.io/trading
    operator: Equal
    value: "true"
    effect: NoSchedule

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: astraeus-oms

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Blue/green: manual promotion required
rollout:
  enabled: true
  strategy: blueGreen
  blueGreen:
    autoPromotionEnabled: false
    previewReplicaCount: 2
    scaleDownDelaySeconds: 300

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    path: /metrics

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: research
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: web
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
    # Broker API egress (Alpaca, IBKR)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP

env: []
