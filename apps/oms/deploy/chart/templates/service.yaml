apiVersion: v1
kind: Service
metadata:
  name: {{ include "astraeus-oms.fullname" . }}
  labels:
    {{- include "astraeus-oms.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "astraeus-oms.selectorLabels" . | nindent 4 }}
---
# Preview service for blue/green
apiVersion: v1
kind: Service
metadata:
  name: {{ include "astraeus-oms.fullname" . }}-preview
  labels:
    {{- include "astraeus-oms.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "astraeus-oms.selectorLabels" . | nindent 4 }}
