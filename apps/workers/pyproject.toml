[project]
name = "astraeus-workers"
version = "0.1.0"
description = "Astraeus background workers. Phase 0: process scaffold only."
requires-python = ">=3.12,<3.13"
dependencies = [
    "astraeus-config",
    "astraeus-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_workers"]
