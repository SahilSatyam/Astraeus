[project]
name = "astraeus-api"
version = "0.1.0"
description = "Astraeus FastAPI service: health, version, RFC 7807 error envelope."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "orjson>=3.10",
    "httpx>=0.27",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-asyncpg>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "astraeus-auth",
    "astraeus-config",
    "astraeus-contracts",
    "astraeus-db",
    "astraeus-domain",
    "astraeus-marketdata",
    "astraeus-observability",
    "astraeus-features",
    "astraeus-rag",
    "astraeus-agent-runtime",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_api"]
