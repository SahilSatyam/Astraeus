[project]
name = "astraeus-recon-worker"
version = "0.1.0"
description = "5-second reconciliation worker — compares local state vs broker."
requires-python = ">=3.12,<3.13"
dependencies = [
    "astraeus-domain",
    "astraeus-config",
    "astraeus-db",
    "astraeus-trading",
    "astraeus-brokers",
    "astraeus-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_recon_worker"]
