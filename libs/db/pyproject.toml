[project]
name = "astraeus-db"
version = "0.1.0"
description = "Async SQLAlchemy engine, session, and Alembic migrations for Astraeus."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "astraeus-config",
    "astraeus-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_db"]
