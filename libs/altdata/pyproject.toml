[project]
name = "astraeus-altdata"
version = "0.1.0"
description = "Alternative data ingestion: document model, source adapters, outbox."
requires-python = ">=3.12,<3.13"
dependencies = [
    "astraeus-config",
    "astraeus-domain",
    "astraeus-db",
    "httpx>=0.27",
    "structlog>=24.1",
    "minio>=7.2",
    "praw>=7.7",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_altdata"]
