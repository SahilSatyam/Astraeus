[project]
name = "astraeus-regime"
version = "0.1.0"
description = "Market regime detection via HMM and GMM with stability filtering."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.6",
    "structlog>=24.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "hmmlearn>=0.3",
    "scikit-learn>=1.4",
    "astraeus-config",
    "astraeus-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_regime"]
