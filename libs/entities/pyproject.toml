[project]
name = "astraeus-entities"
version = "0.1.0"
description = "Ticker dictionary and entity aliases for NLP entity linking."
requires-python = ">=3.12,<3.13"
dependencies = [
    "astraeus-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_entities"]
