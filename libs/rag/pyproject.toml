[project]
name = "astraeus-rag"
version = "0.1.0"
description = "Hybrid retrieval (BM25 + vector + RRF) for the RAG corpus."
requires-python = ">=3.12,<3.13"
dependencies = [
    "astraeus-config",
    "astraeus-db",
    "astraeus-nlp",
    "structlog>=24.1",
    "asyncpg>=0.29",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_rag"]
