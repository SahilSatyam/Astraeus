[project]
name = "astraeus-contracts"
version = "0.1.0"
description = "Pydantic DTOs and request/response contracts shared across services."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_contracts"]
