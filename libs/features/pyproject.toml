[project]
name = "astraeus-features"
version = "0.1.0"
description = "Feature store: PIT-correct retrieval, DSL, registry, and backfill engine."
requires-python = ">=3.12,<3.13"
dependencies = [
    "astraeus-config",
    "astraeus-db",
    "astraeus-domain",
    "astraeus-observability",
    "polars>=1.0",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_features"]
