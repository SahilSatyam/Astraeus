[project]
name = "astraeus-universe"
version = "0.1.0"
description = "Survivorship-bias-aware universe and security master."
requires-python = ">=3.12,<3.13"
dependencies = [
    "astraeus-config",
    "astraeus-db",
    "astraeus-domain",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_universe"]
