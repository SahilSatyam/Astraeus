[project]
name = "astraeus-agent-runtime"
version = "0.1.0"
description = "AI agentic layer — multi-agent orchestration, tools, guardrails, and HITL."
requires-python = ">=3.12,<3.13"
dependencies = [
    "astraeus-config",
    "astraeus-db",
    "astraeus-observability",
    "astraeus-rag",
    "astraeus-features",
    "pydantic>=2.7",
    "structlog>=24.1",
    "anthropic>=0.34",
    "openai>=1.40",
    "tiktoken>=0.7",
    "langgraph>=0.1",
    "langchain-core>=0.2",
    "langchain-anthropic>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_agent_runtime"]
