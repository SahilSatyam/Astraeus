[project]
name = "astraeus-risk"
version = "0.1.0"
description = "Pre-trade risk gateway and circuit breakers for Astraeus."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "astraeus-domain",
    "astraeus-trading",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_risk"]
