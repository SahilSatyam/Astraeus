[project]
name = "astraeus-observability"
version = "0.1.0"
description = "Structured logging, OTel tracing, and Prometheus metrics for Astraeus services."
requires-python = ">=3.12,<3.13"
dependencies = [
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-semantic-conventions>=0.46b0",
    "prometheus-client>=0.20",
    "astraeus-config",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_observability"]
