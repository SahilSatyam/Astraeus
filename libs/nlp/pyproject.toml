[project]
name = "astraeus-nlp"
version = "0.1.0"
description = "NLP pipeline: cleaner, chunker, NER, entity linker, sentiment, embeddings, topics."
requires-python = ">=3.12,<3.13"
dependencies = [
    "astraeus-domain",
    "astraeus-entities",
    "structlog>=24.1",
    "spacy>=3.7",
    "transformers>=4.40",
    "torch>=2.2",
    "sentence-transformers>=2.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
topics = ["bertopic>=0.16", "hdbscan>=0.8", "umap-learn>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_nlp"]
