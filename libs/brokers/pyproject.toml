[project]
name = "astraeus-brokers"
version = "0.1.0"
description = "Broker adapters (Alpaca, IBKR, Binance) for Astraeus EMS."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "alpaca-py>=0.30",
    "astraeus-domain",
    "astraeus-trading",
]

[project.optional-dependencies]
ibkr = ["ib_insync>=0.9"]
binance = ["python-binance>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_brokers"]
