[project]
name = "astraeus-portfolio"
version = "0.1.0"
description = "Portfolio construction, risk management, and attribution engine."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "cvxpy>=1.5",
    "scipy>=1.12",
    "pydantic>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "celery>=5.3",
    "structlog>=24.1",
    "astraeus-config",
    "astraeus-db",
    "astraeus-domain",
    "astraeus-observability",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_portfolio"]
