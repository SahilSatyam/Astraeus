[project]
name = "astraeus-marketdata"
version = "0.1.0"
description = "Market data adapters, ingestion primitives, and lineage for Astraeus."
requires-python = ">=3.12,<3.13"
dependencies = [
    "astraeus-config",
    "astraeus-domain",
    "astraeus-db",
    "httpx>=0.27",
    "structlog>=24.1",
    "exchange-calendars>=4.5",
    "yfinance>=0.2.40",
    "websockets>=12.0",
    "minio>=7.2",
    "aiokafka>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astraeus_marketdata"]
