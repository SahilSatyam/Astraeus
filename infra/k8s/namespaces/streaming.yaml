# Namespace: streaming — Redpanda
apiVersion: v1
kind: Namespace
metadata:
  name: streaming
  labels:
    kubernetes.io/metadata.name: streaming
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: streaming-quota
  namespace: streaming
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 24Gi
    limits.cpu: "12"
    limits.memory: 48Gi
    pods: "15"
    services: "5"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: streaming-limits
  namespace: streaming
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: 500m
        memory: 1Gi
      max:
        cpu: "4"
        memory: 16Gi
      min:
        cpu: 100m
        memory: 256Mi
