# Chaos Mesh: Random pod kill in non-trading namespaces.
# Hypothesis: Workloads tolerate single-pod loss without SLO impact.
# Pass criteria: No alert fires; SLO unaffected.
# Schedule: Weekly in staging, monthly in prod (off-hours only).
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: pod-kill-non-trading
  namespace: chaos-mesh
  labels:
    chaos.astraeus.io/experiment: pod-kill
    chaos.astraeus.io/blast-radius: low
spec:
  schedule: "0 2 * * 6"  # Saturday 02:00 UTC
  type: PodChaos
  historyLimit: 5
  concurrencyPolicy: Forbid
  podChaos:
    action: pod-kill
    mode: one
    selector:
      namespaces:
        - research
        - web
        - agents
      labelSelectors:
        app.kubernetes.io/managed-by: Helm
    gracePeriod: 0
    duration: "10m"
