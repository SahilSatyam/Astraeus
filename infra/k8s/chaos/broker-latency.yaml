# Chaos Mesh: Broker API latency injection.
# Hypothesis: OMS retries with backoff, kill-switch arms on threshold.
# Pass criteria: Kill-switch arms; no double-submits.
# NOTE: This targets egress from the trading namespace to broker endpoints.
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: broker-api-latency
  namespace: chaos-mesh
  labels:
    chaos.astraeus.io/experiment: broker-latency
    chaos.astraeus.io/blast-radius: medium
    chaos.astraeus.io/market-hours: "false"
spec:
  schedule: "0 6 * * 6"  # Saturday 06:00 UTC (market closed)
  type: NetworkChaos
  historyLimit: 5
  concurrencyPolicy: Forbid
  networkChaos:
    action: delay
    mode: all
    selector:
      namespaces:
        - trading
      labelSelectors:
        app.kubernetes.io/name: astraeus-oms
    delay:
      latency: "5000ms"
      jitter: "1000ms"
      correlation: "50"
    direction: to
    externalTargets:
      - "api.alpaca.markets"
      - "paper-api.alpaca.markets"
    duration: "3m"
