# Chaos Mesh: Postgres primary kill (CNPG managed).
# Hypothesis: Failover within 30s; zero data loss.
# Pass criteria: RTO ≤ 30s observed; zero data loss.
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: postgres-primary-kill
  namespace: chaos-mesh
  labels:
    chaos.astraeus.io/experiment: db-failover
    chaos.astraeus.io/blast-radius: high
spec:
  schedule: "0 5 1 * *"  # Monthly, 1st day, 05:00 UTC
  type: PodChaos
  historyLimit: 3
  concurrencyPolicy: Forbid
  podChaos:
    action: pod-kill
    mode: one
    selector:
      namespaces:
        - data
      labelSelectors:
        cnpg.io/cluster: astraeus-db
        role: primary
    gracePeriod: 0
    duration: "30s"
