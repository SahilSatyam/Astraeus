# Chaos Mesh: AZ network partition simulation.
# Hypothesis: Cluster keeps quorum; data services continue.
# Pass criteria: Postgres failover succeeds; Redpanda re-elects leaders.
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: az-network-partition
  namespace: chaos-mesh
  labels:
    chaos.astraeus.io/experiment: network-partition
    chaos.astraeus.io/blast-radius: high
spec:
  schedule: "0 4 15 * *"  # Monthly, 15th day, 04:00 UTC
  type: NetworkChaos
  historyLimit: 3
  concurrencyPolicy: Forbid
  networkChaos:
    action: partition
    mode: all
    selector:
      namespaces:
        - data
      labelSelectors:
        topology.kubernetes.io/zone: us-east-1c
    direction: both
    target:
      mode: all
      selector:
        namespaces:
          - data
        labelSelectors:
          topology.kubernetes.io/zone: us-east-1a
    duration: "2m"
