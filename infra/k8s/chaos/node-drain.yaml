# Chaos Mesh: Node drain simulation.
# Hypothesis: PDBs hold; workloads reschedule within 5 minutes.
# Pass criteria: Drain completes ≤ 5min; zero failed requests.
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: node-drain-simulation
  namespace: chaos-mesh
  labels:
    chaos.astraeus.io/experiment: node-drain
    chaos.astraeus.io/blast-radius: medium
spec:
  schedule: "0 3 1 * *"  # Monthly, 1st day, 03:00 UTC
  type: PhysicalMachineChaos
  historyLimit: 3
  concurrencyPolicy: Forbid
  physicalmachineChaos:
    action: stress-cpu
    mode: one
    selector:
      namespaces:
        - research
    duration: "5m"
