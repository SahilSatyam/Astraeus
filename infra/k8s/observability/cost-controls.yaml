# Cost controls — OpenCost deployment for per-namespace cost visibility.
# Provides Grafana dashboards for cost allocation and budget alerts.
---
# OpenCost Helm values (applied via ArgoCD or helm install)
# This is a reference config — actual install via:
#   helm install opencost opencost/opencost -n observability -f this-file.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencost-config
  namespace: observability
  labels:
    app.kubernetes.io/part-of: astraeus
data:
  # OpenCost custom pricing for cost allocation
  default.json: |
    {
      "provider": "aws",
      "description": "Astraeus cost allocation",
      "CPU": 0.031611,
      "spotCPU": 0.012644,
      "RAM": 0.004237,
      "spotRAM": 0.001695,
      "storage": 0.000138889,
      "zoneNetworkEgress": 0.01,
      "regionNetworkEgress": 0.02,
      "internetNetworkEgress": 0.09
    }
---
# PrometheusRule for cost budget alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cost-budget-alerts
  namespace: observability
  labels:
    app.kubernetes.io/part-of: astraeus
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: cost.budget
      rules:
        # Alert if daily cluster cost exceeds threshold
        - alert: DailyClusterCostHigh
          expr: |
            sum(
              node_total_hourly_cost * 24
            ) > 150
          for: 1h
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Daily cluster cost exceeds $150"
            description: "Projected daily cost: ${{ $value | printf \"%.0f\" }}. Review node scaling and spot usage."

        # Alert if a single namespace exceeds its budget
        - alert: NamespaceCostBudgetExceeded
          expr: |
            sum by (namespace) (
              container_memory_working_set_bytes * on(node) group_left() node_ram_hourly_cost / 1073741824
              +
              container_cpu_usage_seconds_total * on(node) group_left() node_cpu_hourly_cost
            ) * 24 * 30 > 500
          for: 6h
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Namespace {{ $labels.namespace }} projected monthly cost exceeds $500"
            description: "Review workload scaling in namespace {{ $labels.namespace }}."

        # LLM/Agent cost tracking
        - alert: AgentCostBudgetExceeded
          expr: |
            sum by (agent) (
              increase(agent_cost_dollars_total[24h])
            ) > 10
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Agent {{ $labels.agent }} daily cost exceeds $10"
            description: "Agent {{ $labels.agent }} has spent ${{ $value | printf \"%.2f\" }} in the last 24h."
            runbook_url: "https://github.com/sahil/Astraeus/blob/main/infra/runbooks/agent_runaway_cost.md"
