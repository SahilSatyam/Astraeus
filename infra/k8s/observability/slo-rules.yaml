# Prometheus recording and alerting rules for SLOs.
# Burn-rate alerts per Google SRE playbook.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: astraeus-slo-rules
  namespace: observability
  labels:
    app.kubernetes.io/part-of: astraeus
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    # ─── Research API SLOs ───────────────────────────────────────────────
    - name: slo.research-api.availability
      rules:
        # Recording: error ratio over sliding windows
        - record: slo:api_requests:error_ratio_5m
          expr: |
            sum(rate(http_requests_total{namespace="research", job="astraeus-api", code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{namespace="research", job="astraeus-api"}[5m]))

        - record: slo:api_requests:error_ratio_1h
          expr: |
            sum(rate(http_requests_total{namespace="research", job="astraeus-api", code=~"5.."}[1h]))
            /
            sum(rate(http_requests_total{namespace="research", job="astraeus-api"}[1h]))

        - record: slo:api_requests:error_ratio_6h
          expr: |
            sum(rate(http_requests_total{namespace="research", job="astraeus-api", code=~"5.."}[6h]))
            /
            sum(rate(http_requests_total{namespace="research", job="astraeus-api"}[6h]))

        # Alert: Fast burn — burning 14d budget in 1h → page
        - alert: ResearchAPIHighErrorBurnRate
          expr: |
            slo:api_requests:error_ratio_5m > (14 * 0.001)
            and
            slo:api_requests:error_ratio_1h > (14 * 0.001)
          for: 2m
          labels:
            severity: critical
            slo: research-api-availability
            team: platform
          annotations:
            summary: "Research API burning error budget at 14x rate"
            description: "Error ratio {{ $value | humanizePercentage }} over 5m. SLO target: 99.9%."
            runbook_url: "https://github.com/sahil/Astraeus/blob/main/infra/runbooks/api-error-budget.md"

        # Alert: Slow burn — burning 30d budget in 6h → ticket
        - alert: ResearchAPISlowErrorBurn
          expr: |
            slo:api_requests:error_ratio_1h > (6 * 0.001)
            and
            slo:api_requests:error_ratio_6h > (6 * 0.001)
          for: 5m
          labels:
            severity: warning
            slo: research-api-availability
            team: platform
          annotations:
            summary: "Research API slow-burning error budget"
            description: "Error ratio {{ $value | humanizePercentage }} over 1h. Investigate before budget exhaustion."
            runbook_url: "https://github.com/sahil/Astraeus/blob/main/infra/runbooks/api-error-budget.md"

    - name: slo.research-api.latency
      rules:
        - record: slo:api_latency:p99_5m
          expr: |
            histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace="research", job="astraeus-api"}[5m])) by (le))

        - alert: ResearchAPIHighP99Latency
          expr: slo:api_latency:p99_5m > 0.8
          for: 5m
          labels:
            severity: warning
            slo: research-api-latency
            team: platform
          annotations:
            summary: "Research API p99 latency exceeds 800ms SLO"
            description: "p99 latency is {{ $value | humanizeDuration }}. Target: < 800ms."
            runbook_url: "https://github.com/sahil/Astraeus/blob/main/infra/runbooks/api-latency.md"

    # ─── OMS SLOs ────────────────────────────────────────────────────────
    - name: slo.oms.availability
      rules:
        - record: slo:oms_requests:error_ratio_5m
          expr: |
            sum(rate(http_requests_total{namespace="trading", job="astraeus-oms", code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{namespace="trading", job="astraeus-oms"}[5m]))

        - alert: OMSHighErrorRate
          expr: slo:oms_requests:error_ratio_5m > 0.001
          for: 1m
          labels:
            severity: critical
            slo: oms-availability
            team: trading
          annotations:
            summary: "OMS error rate exceeds 0.1% — potential order failures"
            description: "Error ratio {{ $value | humanizePercentage }}. Immediate investigation required."
            runbook_url: "https://github.com/sahil/Astraeus/blob/main/infra/runbooks/oms-errors.md"

    - name: slo.oms.latency
      rules:
        - record: slo:oms_latency:p99_5m
          expr: |
            histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace="trading", job="astraeus-oms"}[5m])) by (le))

        - alert: OMSHighOrderLatency
          expr: slo:oms_latency:p99_5m > 0.2
          for: 2m
          labels:
            severity: critical
            slo: oms-latency
            team: trading
          annotations:
            summary: "OMS p99 order ack latency exceeds 200ms"
            description: "p99 latency is {{ $value | humanizeDuration }}. Target: < 200ms."
            runbook_url: "https://github.com/sahil/Astraeus/blob/main/infra/runbooks/oms-latency.md"

    # ─── Reconciliation (hard-gate) ─────────────────────────────────────
    - name: slo.oms.reconciliation
      rules:
        - alert: ReconciliationDriftDetected
          expr: recon_drift_total > 0
          for: 0m
          labels:
            severity: critical
            slo: oms-reconciliation
            team: trading
          annotations:
            summary: "Reconciliation drift detected — kill-switch may arm"
            description: "{{ $value }} drift events detected. Zero tolerance SLO."
            runbook_url: "https://github.com/sahil/Astraeus/blob/main/infra/runbooks/recon_drift.md"

    # ─── Market Data Ingest ──────────────────────────────────────────────
    - name: slo.market-data.freshness
      rules:
        - alert: MarketDataStale
          expr: |
            time() - max(market_data_last_tick_timestamp{namespace="streaming"}) > 5
          for: 1m
          labels:
            severity: warning
            slo: market-data-freshness
            team: data
          annotations:
            summary: "Market data tick-to-DB freshness exceeds 5s"
            description: "Last tick was {{ $value | humanizeDuration }} ago during market hours."
            runbook_url: "https://github.com/sahil/Astraeus/blob/main/infra/runbooks/market-data-stall.md"

    # ─── Kill Switch ─────────────────────────────────────────────────────
    - name: alerts.kill-switch
      rules:
        - alert: KillSwitchArmed
          expr: kill_switch_armed == 1
          for: 0m
          labels:
            severity: critical
            team: trading
          annotations:
            summary: "Kill switch is ARMED — all trading halted"
            description: "Kill switch armed at {{ $value }}. Check OMS and reconciliation."
            runbook_url: "https://github.com/sahil/Astraeus/blob/main/infra/runbooks/kill_switch_flip.md"

    # ─── Web Frontend SLOs ───────────────────────────────────────────────
    - name: slo.web.availability
      rules:
        # Recording: error ratio for web service
        - record: slo:web_requests:error_ratio_5m
          expr: |
            sum(rate(http_requests_total{namespace="web", job="astraeus-web", code=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{namespace="web", job="astraeus-web"}[5m]))

        - record: slo:web_requests:error_ratio_1h
          expr: |
            sum(rate(http_requests_total{namespace="web", job="astraeus-web", code=~"5.."}[1h]))
            /
            sum(rate(http_requests_total{namespace="web", job="astraeus-web"}[1h]))

        # Alert: Web error rate exceeds budget
        - alert: WebHighErrorRate
          expr: |
            slo:web_requests:error_ratio_5m > (14 * 0.001)
            and
            slo:web_requests:error_ratio_1h > (14 * 0.001)
          for: 2m
          labels:
            severity: critical
            team: web
          annotations:
            summary: "Web frontend error rate exceeds SLO budget"
            description: "5m error ratio: {{ $value | humanizePercentage }}. SLO target: 99.9%."
            runbook_url: "https://github.com/sahil/Astraeus/blob/main/infra/runbooks/api_error_budget.md"

    - name: slo.web.latency
      rules:
        # Recording: p99 latency for web
        - record: slo:web_latency:p99_5m
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{namespace="web", job="astraeus-web"}[5m]))
              by (le)
            )

        # Alert: Web p99 latency exceeds 2s budget (LCP)
        - alert: WebHighLatency
          expr: slo:web_latency:p99_5m > 2.0
          for: 5m
          labels:
            severity: warning
            team: web
          annotations:
            summary: "Web p99 latency exceeds 2s LCP budget"
            description: "Current p99: {{ $value | humanizeDuration }}. Target: < 2s."

        # Alert: Web Vitals LCP degradation
        - alert: WebLCPDegraded
          expr: |
            avg(web_vital_lcp_seconds{quantile="0.75"}) > 2.5
          for: 10m
          labels:
            severity: warning
            team: web
          annotations:
            summary: "Web Vitals LCP (p75) exceeds 2.5s Good threshold"
            description: "p75 LCP: {{ $value | humanizeDuration }}. Users experiencing slow loads."
