# OpenTelemetry Collector — receives traces/metrics/logs from all services,
# exports to Tempo (traces), Mimir (metrics), Loki (logs).
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: platform
spec:
  mode: deployment
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 2048

      memory_limiter:
        check_interval: 1s
        limit_mib: 800
        spike_limit_mib: 200

      resource:
        attributes:
          - key: cluster
            value: astraeus-prod
            action: upsert
          - key: environment
            value: prod
            action: upsert

      # Tail-based sampling: 100% on error, 5% baseline
      tail_sampling:
        decision_wait: 10s
        policies:
          - name: errors-always
            type: status_code
            status_code:
              status_codes:
                - ERROR
          - name: baseline-sample
            type: probabilistic
            probabilistic:
              sampling_percentage: 5

    exporters:
      otlp/tempo:
        endpoint: tempo.observability:4317
        tls:
          insecure: true

      prometheusremotewrite:
        endpoint: http://mimir.observability:9009/api/v1/push
        resource_to_telemetry_conversion:
          enabled: true

      loki:
        endpoint: http://loki.observability:3100/loki/api/v1/push

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [health_check, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, tail_sampling, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [loki]
