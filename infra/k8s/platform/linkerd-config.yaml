# Linkerd mTLS configuration.
# Linkerd is installed via Helm (linkerd/linkerd2); this file configures
# the service mesh behavior for the Astraeus platform.
#
# Installation:
#   helm repo add linkerd https://helm.linkerd.io/stable
#   helm install linkerd-crds linkerd/linkerd-crds -n linkerd --create-namespace
#   helm install linkerd-control-plane linkerd/linkerd-control-plane -n linkerd \
#     --set identity.externalCA=true  # Use cert-manager for CA
#
# Namespace injection is controlled via labels:
#   linkerd.io/inject: enabled
---
# Server authorization: trading namespace requires mTLS for all traffic
apiVersion: policy.linkerd.io/v1beta2
kind: Server
metadata:
  name: oms-server
  namespace: trading
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: astraeus-oms
  port: http
  proxyProtocol: HTTP/2
---
apiVersion: policy.linkerd.io/v1beta2
kind: ServerAuthorization
metadata:
  name: oms-allow-research
  namespace: trading
spec:
  server:
    name: oms-server
  client:
    meshTLS:
      serviceAccounts:
        - name: api
          namespace: research
        - name: web
          namespace: web
---
# Deny all unauthenticated traffic to trading namespace
apiVersion: policy.linkerd.io/v1beta2
kind: ServerAuthorization
metadata:
  name: oms-deny-unauthenticated
  namespace: trading
spec:
  server:
    name: oms-server
  client:
    unauthenticated: false
---
# AuthorizationPolicy: only meshed clients can reach OMS
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: require-mtls-oms
  namespace: trading
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: oms-server
  requiredAuthenticationRefs:
    - name: mesh-tls
      kind: MeshTLSAuthentication
      group: policy.linkerd.io
---
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: mesh-tls
  namespace: trading
spec:
  identities:
    - "*.research.serviceaccount.identity.linkerd.cluster.local"
    - "*.web.serviceaccount.identity.linkerd.cluster.local"
    - "*.trading.serviceaccount.identity.linkerd.cluster.local"
