global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: astraeus-local
    env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: workers
    metrics_path: /metrics
    static_configs:
      - targets: ["workers:8001"]
        labels:
          service: workers
