name: astraeus

services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: astraeus/api:dev
    command:
      - /bin/sh
      - -c
      - cd /app/libs/db && alembic upgrade head && cd /app && uvicorn astraeus_api.main:app --host 0.0.0.0 --port 8000
    environment:
      ASTRAEUS_ENV: local
      ASTRAEUS_APP_NAME: api
      ASTRAEUS_APP_VERSION: 0.1.0-dev
      ASTRAEUS_DB_HOST: postgres
      ASTRAEUS_DB_PORT: "5432"
      ASTRAEUS_DB_USER: astraeus
      ASTRAEUS_DB_PASSWORD: astraeus
      ASTRAEUS_DB_NAME: astraeus
      ASTRAEUS_REDIS_HOST: redis
      ASTRAEUS_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ASTRAEUS_OBS_OTLP_ENDPOINT: http://jaeger:4317
      ASTRAEUS_OBS_OTLP_INSECURE: "true"
      ASTRAEUS_OBS_LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    ports:
      - "8000:8000"

  workers:
    build:
      context: ../..
      dockerfile: apps/workers/Dockerfile
    image: astraeus/workers:dev
    environment:
      ASTRAEUS_ENV: local
      ASTRAEUS_APP_NAME: workers
      ASTRAEUS_APP_VERSION: 0.1.0-dev
      ASTRAEUS_DB_HOST: postgres
      ASTRAEUS_DB_USER: astraeus
      ASTRAEUS_DB_PASSWORD: astraeus
      ASTRAEUS_DB_NAME: astraeus
      ASTRAEUS_REDIS_HOST: redis
      ASTRAEUS_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ASTRAEUS_KAFKA_SCHEMA_REGISTRY_URL: http://karapace-registry:8081
      ASTRAEUS_OBS_OTLP_ENDPOINT: http://jaeger:4317
      ASTRAEUS_OBS_OTLP_INSECURE: "true"
      ASTRAEUS_OBS_LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # Dev port mappings for the data plane (only enabled in this override file).
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  redpanda:
    ports:
      - "19092:19092"
      - "8082:8082"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  karapace-registry:
    ports:
      - "8081:8081"

  jaeger:
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    ports:
      - "9090:9090"

  grafana:
    ports:
      - "3000:3000"

  # --- Phase 2: Research Sandbox ---

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.0
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://astraeus:astraeus@postgres:5432/astraeus
      - --default-artifact-root=s3://astraeus-mlflow/
      - --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: astraeus
      AWS_SECRET_ACCESS_KEY: astraeus123
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5000:5000"

  jupyterlab:
    image: jupyter/scipy-notebook:python-3.12
    command: start-notebook.py --NotebookApp.token='' --NotebookApp.password=''
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      ASTRAEUS_DB_HOST: postgres
      ASTRAEUS_DB_PORT: "5432"
      ASTRAEUS_DB_USER: astraeus
      ASTRAEUS_DB_PASSWORD: astraeus
      ASTRAEUS_DB_NAME: astraeus
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: astraeus
      AWS_SECRET_ACCESS_KEY: astraeus123
    volumes:
      - notebookdata:/home/jovyan/work
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8888:8888"
