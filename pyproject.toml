[project]
name = "astraeus"
version = "0.1.0"
description = "Institutional-grade AI trading and research platform."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[tool.uv.workspace]
members = ["apps/api", "apps/workers", "apps/oms", "apps/recon_worker", "libs/*"]

[tool.uv.sources]
astraeus-domain = { workspace = true }
astraeus-contracts = { workspace = true }
astraeus-config = { workspace = true }
astraeus-db = { workspace = true }
astraeus-observability = { workspace = true }
astraeus-marketdata = { workspace = true }
astraeus-features = { workspace = true }
astraeus-universe = { workspace = true }
astraeus-strategy = { workspace = true }
astraeus-portfolio = { workspace = true }
astraeus-entities = { workspace = true }
astraeus-altdata = { workspace = true }
astraeus-nlp = { workspace = true }
astraeus-rag = { workspace = true }
astraeus-agent-runtime = { workspace = true }
astraeus-recommender = { workspace = true }
astraeus-regime = { workspace = true }
astraeus-ensemble = { workspace = true }
astraeus-auth = { workspace = true }
astraeus-trading = { workspace = true }
astraeus-brokers = { workspace = true }
astraeus-risk = { workspace = true }
astraeus-oms = { workspace = true }
astraeus-recon-worker = { workspace = true }
astraeus-api = { workspace = true }
astraeus-workers = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "libs"]
extend-exclude = ["**/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RET",
    "TCH", "ARG", "PTH", "ERA", "PL", "RUF", "ASYNC", "PERF",
]
ignore = [
    "S101",    # asserts ok in tests
    "PLR0913", # don't nit on argument count
    "PLR2004", # magic numbers occasionally fine
    "B008",    # FastAPI Query/Depends in defaults is standard pattern
    "PLC0415", # import outside top-level — intentional lazy loading for heavy ML models
    "RUF002",  # ambiguous unicode in docstrings — smart quotes from docs are fine
    "RUF003",  # ambiguous unicode in comments
    "RUF001",  # ambiguous unicode in strings
    "ERA001",  # commented-out code — kept intentionally for reference
    "ARG002",  # unused method argument — common in ABC/protocol implementations
    "ARG001",  # unused function argument — same
    "RET504",  # unnecessary assign before return — readability preference
    "TC003",   # typing-only stdlib import — not worth the churn
    "TC001",   # typing-only first-party import
    "TC002",   # typing-only third-party import
    "S608",    # hardcoded SQL — we use parameterized queries with text()
    "SIM108",  # if-else-block-instead-of-if-exp — readability preference
    "SIM105",  # suppressible-exception — contextlib.suppress not always clearer
    "SIM117",  # multiple-with-statements — readability preference
    "PERF401", # manual-list-comprehension — readability preference
    "PERF102", # incorrect-dict-iterator — minor perf, not worth churn
    "RUF059",  # unused-unpacked-variable — common in tuple unpacking
    "PLW0108", # unnecessary-lambda — sometimes clearer
    "PLW2901", # redefined-loop-name — common pattern
    "PLR0911", # too-many-return-statements
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "S110",    # try-except-pass — intentional in some cases
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PLR2004", "ARG", "PLR0915", "F841"]
"libs/db/**/migrations/**" = ["E501", "I001", "ERA001"]
"scripts/**" = ["S603", "S607", "S310", "E501"]
"libs/marketdata/astraeus_marketdata/models.py" = ["TC003"]
"libs/marketdata/astraeus_marketdata/adapters/base.py" = ["TC003"]
"libs/altdata/**" = ["E501"]
"libs/nlp/**" = ["E501"]
"libs/rag/**" = ["E501"]
"libs/features/**" = ["E501", "PLW1510"]
"libs/strategy/**" = ["E501"]
"apps/api/**" = ["E501"]
"libs/portfolio/**" = ["E501", "PLR0912", "E741", "B007", "B904", "RUF043"]
"libs/portfolio/**/tests/**" = ["S", "PLR2004", "ARG", "PLR0915", "F841", "B904", "RUF043"]
"apps/workers/**" = ["E501"]
"libs/agent_runtime/**" = ["E501"]
"libs/recommender/**" = ["E501"]
"libs/regime/**" = ["E501"]
"libs/ensemble/**" = ["E501"]
"libs/trading/**" = ["E501"]
"libs/brokers/**" = ["E501", "B027"]
"libs/risk/**" = ["E501", "S105"]
"apps/oms/**" = ["E501", "PLW0603"]
"apps/recon_worker/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
exclude = [
    "libs/db/.*/migrations/versions/.*",
    "build/",
    "dist/",
    ".*/tests/.*",
]

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "testcontainers.*",
    "prometheus_fastapi_instrumentator.*",
    "yfinance.*",
    "exchange_calendars.*",
    "minio.*",
    "websockets.*",
    "scipy.*",
    "optuna.*",
    "ray.*",
    "mlflow.*",
    "spacy.*",
    "transformers.*",
    "torch.*",
    "sentence_transformers.*",
    "tiktoken.*",
    "bertopic.*",
    "hdbscan.*",
    "umap.*",
    "praw.*",
    "feedparser.*",
    "bs4.*",
    "numpy.*",
    "hmmlearn.*",
    "sklearn.*",
    "alpaca.*",
    "ib_insync.*",
    "jose.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "astraeus_portfolio.*",
    "astraeus_strategy.*",
    "astraeus_nlp.*",
    "astraeus_altdata.*",
    "astraeus_rag.*",
    "astraeus_features.*",
    "astraeus_workers.*",
    "astraeus_contracts.*",
    "astraeus_marketdata.*",
    "astraeus_api.*",
    "astraeus_agent_runtime.*",
    "astraeus_recommender.*",
    "astraeus_regime.*",
    "astraeus_ensemble.*",
    "astraeus_trading.*",
    "astraeus_brokers.*",
    "astraeus_risk.*",
    "astraeus_oms.*",
    "astraeus_recon_worker.*",
]
strict = false
disable_error_code = ["attr-defined", "no-any-return", "arg-type", "assignment", "no-untyped-def", "unused-ignore", "type-arg", "operator", "list-item", "no-untyped-call", "misc", "valid-type", "name-defined", "import-not-found", "untyped-decorator", "no-redef", "union-attr", "index", "var-annotated"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["apps", "libs"]
markers = [
    "unit: fast in-process tests",
    "integration: tests requiring containers",
    "e2e: full-stack smoke tests",
]

[tool.coverage.run]
branch = true
source = ["apps", "libs"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
